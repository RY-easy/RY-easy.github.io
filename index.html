<!-- ================================= -->
<!-- 深空专注系统 v3 -->
<!-- 增加： -->
<!-- 1. 夏以昼风格角色区 -->
<!-- 2. 默认番茄钟 -->
<!-- 3. 自定义时间 -->
<!-- 4. 模式切换 -->
<!-- ================================= -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>深空专注系统</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    overflow:hidden;
    background:#030816;
    color:white;
    height:100vh;
}

/* ========================= */
/* 星空背景 */
/* ========================= */

.space-bg{
    position:fixed;
    inset:0;
    overflow:hidden;

    background:
    radial-gradient(circle at top,#234cff22,transparent 30%),
    radial-gradient(circle at bottom,#0e2b5544,transparent 40%),
    linear-gradient(to bottom,#020817,#07111f);
}

.star{
    position:absolute;
    background:white;
    border-radius:50%;
    animation:twinkle linear infinite;
}

@keyframes twinkle{
    0%{opacity:.2}
    50%{opacity:1}
    100%{opacity:.2}
}

/* 光晕 */

.glow{
    position:absolute;
    border-radius:50%;
    filter:blur(100px);
    opacity:.3;
    animation:float 10s ease-in-out infinite;
}

.glow1{
    width:500px;
    height:500px;
    background:#5077ff;
    top:-100px;
    left:-100px;
}

.glow2{
    width:450px;
    height:450px;
    background:#3e5fff;
    right:-100px;
    bottom:-100px;
}

@keyframes float{
    0%{transform:translateY(0)}
    50%{transform:translateY(-30px)}
    100%{transform:translateY(0)}
}

/* ========================= */
/* 主布局 */
/* ========================= */

.app{
    display:flex;
    height:100vh;
    position:relative;
    z-index:2;
}

/* 左侧 */

.sidebar{

    width:90px;

    background:rgba(10,15,30,.45);

    backdrop-filter:blur(20px);

    border-right:1px solid rgba(255,255,255,.08);

    display:flex;
    flex-direction:column;

    align-items:center;

    padding:30px 0;

    gap:28px;
}

.logo{

    width:56px;
    height:56px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
    linear-gradient(145deg,#8db5ff,#5578ff);

    font-size:24px;

    box-shadow:
    0 0 25px rgba(120,160,255,.45);
}

.nav-btn{

    width:58px;
    height:58px;

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:rgba(255,255,255,.04);

    color:#dce5ff;

    cursor:pointer;

    transition:.3s;
}

.nav-btn:hover{

    transform:translateY(-4px);

    background:rgba(120,160,255,.12);

    box-shadow:
    0 0 20px rgba(120,160,255,.2);
}

/* ========================= */
/* 主区域 */
/* ========================= */

.main{

    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;
}

.window{

    width:88%;
    height:88vh;

    border-radius:42px;

    overflow:hidden;

    position:relative;

    background:
    linear-gradient(
    145deg,
    rgba(20,30,60,.55),
    rgba(10,15,35,.35));

    backdrop-filter:blur(30px);

    border:
    1px solid rgba(255,255,255,.08);

    display:flex;
}

/* ========================= */
/* 中间专注区 */
/* ========================= */

.focus-area{

    flex:1;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:center;

    position:relative;
}

/* 能源环 */

.energy-ring{

    width:420px;
    height:420px;

    border-radius:50%;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    animation:ringFloat 6s ease-in-out infinite;
}

.energy-ring::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    background:
    conic-gradient(
    from 0deg,
    #6ea1ff,
    #dbe6ff,
    #6ea1ff);

    animation:rotate 10s linear infinite;

    box-shadow:
    0 0 35px rgba(120,160,255,.6);
}

.energy-ring::after{

    content:"";

    position:absolute;

    width:360px;
    height:360px;

    border-radius:50%;

    background:#07111f;
}

@keyframes rotate{
    from{transform:rotate(0deg)}
    to{transform:rotate(360deg)}
}

@keyframes ringFloat{
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
}

/* 内容 */

.timer-content{

    position:relative;
    z-index:5;

    display:flex;
    flex-direction:column;

    align-items:center;
}

.mode{

    color:#a8bcff;

    letter-spacing:4px;

    margin-bottom:18px;
}

.time{

    font-size:90px;
    font-weight:200;

    letter-spacing:4px;
}

.tip{

    margin-top:15px;

    color:#8ea2da;
}

/* 模式选择 */

.timer-options{

    margin-top:40px;

    display:flex;
    gap:12px;

    flex-wrap:wrap;

    justify-content:center;
}

.option-btn{

    padding:12px 20px;

    border-radius:14px;

    border:none;

    background:
    rgba(255,255,255,.06);

    color:white;

    cursor:pointer;

    transition:.3s;
}

.option-btn:hover{

    background:
    rgba(120,160,255,.2);
}

/* 自定义 */

.custom-box{

    margin-top:20px;

    display:flex;
    gap:10px;

    align-items:center;
}

.custom-box input{

    width:100px;

    padding:12px;

    border-radius:12px;

    border:none;

    outline:none;

    background:
    rgba(255,255,255,.08);

    color:white;

    text-align:center;
}

/* 按钮 */

.controls{

    margin-top:35px;

    display:flex;
    gap:18px;
}

.control-btn{

    padding:16px 34px;

    border:none;

    border-radius:18px;

    color:white;

    cursor:pointer;

    background:
    linear-gradient(
    145deg,
    #8db5ff,
    #5578ff);

    box-shadow:
    0 0 25px rgba(120,160,255,.35);

    transition:.3s;
}

.control-btn:hover{

    transform:translateY(-3px);
}

/* ========================= */
/* 右侧陪伴区 */
/* ========================= */

.companion{

    width:360px;

    position:relative;

    border-left:
    1px solid rgba(255,255,255,.06);

    overflow:hidden;

    background:
    linear-gradient(
    to bottom,
    rgba(15,20,40,.35),
    rgba(5,10,20,.2));
}

/* 人物 */

.character{

    position:absolute;

    right:-20px;
    bottom:0;

    height:95%;

    opacity:.95;

    filter:
    drop-shadow(0 0 35px rgba(120,160,255,.25));

    animation:floatChar 5s ease-in-out infinite;
}

@keyframes floatChar{
    0%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
    100%{transform:translateY(0)}
}

/* UI */

.companion-ui{

    position:absolute;

    left:35px;
    top:60px;

    z-index:5;

    width:230px;
}

.title{

    font-size:28px;

    margin-bottom:22px;
}

.quote{

    line-height:2;

    color:#dce5ff;

    font-size:18px;
}

.signature{

    margin-top:20px;

    color:#89a0dc;
}

/* 底部 */

.bottom-system{

    position:absolute;

    left:50%;
    bottom:30px;

    transform:translateX(-50%);

    width:560px;

    height:72px;

    border-radius:24px;

    background:
    rgba(10,15,30,.5);

    backdrop-filter:blur(25px);

    border:
    1px solid rgba(255,255,255,.08);

    display:flex;

    align-items:center;
    justify-content:space-around;
}

/* 响应式 */

@media(max-width:1200px){

    .companion{
        display:none;
    }

    .energy-ring{
        width:320px;
        height:320px;
    }

    .energy-ring::after{
        width:260px;
        height:260px;
    }

    .time{
        font-size:65px;
    }
}

</style>
</head>

<body>

<!-- 背景 -->

<div class="space-bg">

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

</div>

<div class="app">

    <!-- 左侧 -->

    <div class="sidebar">

        <div class="logo">✦</div>

        <div class="nav-btn">⌛</div>
        <div class="nav-btn">♫</div>
        <div class="nav-btn">☾</div>
        <div class="nav-btn">☍</div>
        <div class="nav-btn">⚙</div>

    </div>

    <!-- 主体 -->

    <div class="main">

        <div class="window">

            <!-- 中间 -->

            <div class="focus-area">

                <div class="energy-ring">

                    <div class="timer-content">

                        <div class="mode">
                            FOCUS MODE
                        </div>

                        <div class="time" id="timer">
                            25:00
                        </div>

                        <div class="tip">
                            沉浸当下，未来会如你所愿。
                        </div>

                    </div>

                </div>

                <!-- 番茄钟选项 -->

                <div class="timer-options">

                    <button class="option-btn"
                    onclick="setTimer(25)">
                        🍅 番茄钟 25min
                    </button>

                    <button class="option-btn"
                    onclick="setTimer(50)">
                        📘 深度学习 50min
                    </button>

                    <button class="option-btn"
                    onclick="setTimer(15)">
                        ☕ 短休息 15min
                    </button>

                </div>

                <!-- 自定义 -->

                <div class="custom-box">

                    <input
                    type="number"
                    id="customMinutes"
                    placeholder="分钟">

                    <button
                    class="option-btn"
                    onclick="customTimer()">
                        自定义时间
                    </button>

                </div>

                <!-- 控制 -->

                <div class="controls">

                    <button
                    class="control-btn"
                    onclick="startTimer()">
                        开始专注
                    </button>

                    <button
                    class="control-btn"
                    onclick="pauseTimer()">
                        暂停
                    </button>

                    <button
                    class="control-btn"
                    onclick="resetTimer()">
                        重置
                    </button>

                </div>

            </div>

            <!-- 右侧 -->

            <div class="companion">

                <div class="companion-ui">

                    <div class="title">
                        夏以昼的陪伴
                    </div>

                    <div class="quote">
                        “别分神。<br>
                        你的每一分钟，<br>
                        都很重要。”
                    </div>

                    <div class="signature">
                        —— Deep Space
                    </div>

                </div>

                <!-- 这里替换成夏以昼风格 -->

                <img
                class="character"
                src="https://cdn.pixabay.com/photo/2024/03/03/17/55/ai-generated-8607805_1280.png">

            </div>

            <!-- 底部 -->

            <div class="bottom-system">

                <div>✦ 深空模式</div>
                <div>☾ 白噪音</div>
                <div>♫ 星际环境音</div>
                <div>⚡ 沉浸专注</div>

            </div>

        </div>

    </div>

</div>

<script>

/* ========================= */
/* 星空生成 */
/* ========================= */

const bg = document.querySelector(".space-bg");

for(let i=0;i<160;i++){

    let star = document.createElement("div");

    star.classList.add("star");

    let size = Math.random()*3;

    star.style.width = size+"px";
    star.style.height = size+"px";

    star.style.left = Math.random()*100+"%";
    star.style.top = Math.random()*100+"%";

    star.style.animationDuration =
    2 + Math.random()*5 + "s";

    bg.appendChild(star);
}

/* ========================= */
/* 番茄钟 */
/* ========================= */

let totalSeconds = 25 * 60;

let initialSeconds = totalSeconds;

let timer;

/* 更新时间 */

function updateDisplay(){

    let minutes =
    Math.floor(totalSeconds / 60);

    let seconds =
    totalSeconds % 60;

    document.getElementById("timer").innerHTML =
    `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
}

/* 设置时间 */

function setTimer(minutes){

    totalSeconds = minutes * 60;

    initialSeconds = totalSeconds;

    updateDisplay();
}

/* 自定义 */

function customTimer(){

    const custom =
    document.getElementById("customMinutes").value;

    if(custom && custom > 0){

        setTimer(custom);
    }
}

/* 开始 */

function startTimer(){

    clearInterval(timer);

    timer = setInterval(()=>{

        if(totalSeconds > 0){

            totalSeconds--;

            updateDisplay();

        }else{

            clearInterval(timer);

            alert("专注结束，休息一下吧。");
        }

    },1000);
}

/* 暂停 */

function pauseTimer(){

    clearInterval(timer);
}

/* 重置 */

function resetTimer(){

    clearInterval(timer);

    totalSeconds = initialSeconds;

    updateDisplay();
}

</script>

</body>
</html>
