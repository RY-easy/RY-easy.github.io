<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Deep Space Focus</title>

<style>

:root{

    --bg:#060816;

    --panel:rgba(17,24,39,.62);

    --border:rgba(255,255,255,.08);

    --blue:#5DA9FF;

    --purple:#8B5CFF;

    --orange:#FFB347;

    --text:#F4F7FF;

    --sub:#9FAED3;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    font-family:
    "Segoe UI",
    sans-serif;

    background:
    radial-gradient(circle at top left,
    rgba(139,92,255,.22),
    transparent 25%),

    radial-gradient(circle at bottom right,
    rgba(93,169,255,.16),
    transparent 30%),

    linear-gradient(
    180deg,
    #040612,
    #060816);

    color:var(--text);

    overflow:hidden;

    height:100vh;
}

/* ================================= */
/* 星空 */
/* ================================= */

.stars{

    position:fixed;

    inset:0;

    z-index:0;

    overflow:hidden;
}

.star{

    position:absolute;

    background:white;

    border-radius:50%;

    opacity:.8;

    animation:
    twinkle linear infinite;
}

@keyframes twinkle{

    0%{opacity:.2}

    50%{opacity:1}

    100%{opacity:.2}
}

/* ================================= */
/* 星云 */
/* ================================= */

.nebula{

    position:fixed;

    width:700px;
    height:700px;

    border-radius:50%;

    filter:blur(140px);

    opacity:.14;

    z-index:0;

    animation:
    float 20s ease-in-out infinite;
}

.nebula1{

    background:#8B5CFF;

    top:-250px;
    left:-250px;
}

.nebula2{

    background:#5DA9FF;

    right:-250px;
    bottom:-250px;
}

@keyframes float{

    0%{
        transform:
        translate(0,0);
    }

    50%{
        transform:
        translate(20px,-30px);
    }

    100%{
        transform:
        translate(0,0);
    }
}

/* ================================= */
/* APP */
/* ================================= */

.app{

    position:relative;

    z-index:2;

    display:flex;

    height:100vh;
}

/* ================================= */
/* 左侧导航 */
/* ================================= */

.sidebar{

    width:90px;

    background:
    rgba(8,10,25,.72);

    backdrop-filter:
    blur(25px);

    border-right:
    1px solid rgba(255,255,255,.06);

    display:flex;

    flex-direction:column;

    align-items:center;

    padding:28px 0;

    gap:24px;
}

.logo{

    width:58px;
    height:58px;

    border-radius:18px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
    linear-gradient(
    145deg,
    var(--purple),
    var(--blue));

    box-shadow:
    0 0 25px
    rgba(139,92,255,.45);

    font-size:22px;
}

.nav-btn{

    width:56px;
    height:56px;

    border-radius:18px;

    display:flex;

    align-items:center;
    justify-content:center;

    background:
    rgba(255,255,255,.04);

    color:#dbe5ff;

    transition:.3s;

    cursor:pointer;
}

.nav-btn:hover{

    transform:
    translateY(-4px);

    background:
    rgba(139,92,255,.16);
}

/* ================================= */
/* 主布局 */
/* ================================= */

.main{

    flex:1;

    padding:26px;

    display:grid;

    grid-template-columns:
    340px
    1fr
    360px;

    gap:26px;

    overflow:hidden;
}

/* ================================= */
/* 面板 */
/* ================================= */

.panel{

    background:var(--panel);

    border:
    1px solid var(--border);

    backdrop-filter:
    blur(25px);

    border-radius:30px;

    box-shadow:
    0 10px 40px
    rgba(0,0,0,.22);

    animation:
    breathing 6s ease-in-out infinite;
}

@keyframes breathing{

    0%{

        transform:
        translateY(0px);
    }

    50%{

        transform:
        translateY(-4px);
    }

    100%{

        transform:
        translateY(0px);
    }
}

/* ================================= */
/* 左边 */
/* ================================= */

.dashboard{

    padding:24px;

    overflow-y:auto;
}

.dashboard::-webkit-scrollbar{

    width:0;
}

.section{

    margin-bottom:24px;
}

.panel-title{

    margin-bottom:18px;

    color:#dbe5ff;

    font-size:18px;
}

/* 输入 */

.subject-input{

    display:flex;

    gap:10px;
}

.subject-input input{

    flex:1;

    padding:14px;

    border:none;

    outline:none;

    border-radius:16px;

    background:
    rgba(255,255,255,.06);

    color:white;
}

.subject-input button{

    border:none;

    padding:14px 18px;

    border-radius:16px;

    cursor:pointer;

    color:white;

    background:
    linear-gradient(
    145deg,
    var(--purple),
    var(--blue));
}

.current-subject{

    margin-top:16px;

    color:var(--sub);
}

/* 数据 */

.stats{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:14px;
}

.stat-card{

    padding:18px;

    border-radius:20px;

    background:
    rgba(255,255,255,.04);
}

.stat-label{

    color:var(--sub);

    font-size:14px;
}

.stat-value{

    margin-top:10px;

    font-size:30px;

    font-weight:700;
}

/* 历史 */

.history-item{

    padding:14px;

    border-radius:16px;

    background:
    rgba(255,255,255,.04);

    margin-bottom:12px;

    line-height:1.8;

    color:#dbe5ff;
}

/* 热力图 */

.heatmap{

    display:grid;

    grid-template-columns:
    repeat(7,34px);

    gap:8px;
}

.heat-cell{

    width:34px;
    height:34px;

    border-radius:8px;

    background:
    rgba(255,255,255,.05);

    transition:.3s;
}

/* 排行榜 */

.rank-item{

    margin-bottom:20px;
}

.rank-top{

    display:flex;

    justify-content:space-between;

    margin-bottom:10px;
}

.rank-bar{

    height:10px;

    border-radius:10px;

    overflow:hidden;

    background:
    rgba(255,255,255,.06);
}

.rank-fill{

    height:100%;

    width:0;

    border-radius:10px;

    background:
    linear-gradient(
    90deg,
    var(--purple),
    var(--blue),
    var(--orange));

    transition:
    width 1.2s ease;
}

/* ================================= */
/* 中间 */
/* ================================= */

.center{

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;
}

/* 环 */

.energy-ring{

    position:relative;

    width:430px;
    height:430px;

    display:flex;

    align-items:center;
    justify-content:center;
}

.progress-ring{

    position:absolute;

    transform:
    rotate(-90deg);
}

.ring-bg{

    fill:none;

    stroke:
    rgba(255,255,255,.06);

    stroke-width:12;
}

.ring-progress{

    fill:none;

    stroke-width:14;

    stroke-linecap:round;

    stroke-dasharray:1130;

    stroke-dashoffset:0;

    transition:
    stroke-dashoffset 1s linear;

    filter:
    drop-shadow(
    0 0 18px
    rgba(139,92,255,.8));
}

.timer-content{

    position:relative;

    z-index:5;

    text-align:center;
}

.mode{

    letter-spacing:5px;

    color:#c8d5ff;

    margin-bottom:16px;
}

.time{

    font-size:92px;

    font-weight:200;
}

.tip{

    margin-top:16px;

    color:#97A6D1;
}

/* 按钮 */

.controls{

    margin-top:36px;

    display:flex;

    gap:16px;
}

.control-btn{

    border:none;

    padding:16px 26px;

    border-radius:18px;

    color:white;

    cursor:pointer;

    transition:.3s;
}

.primary{

    background:
    linear-gradient(
    145deg,
    var(--purple),
    var(--blue));

    box-shadow:
    0 0 24px
    rgba(139,92,255,.35);
}

.secondary{

    background:
    rgba(255,255,255,.06);
}

.control-btn:hover{

    transform:
    translateY(-3px);
}

/* 白噪音 */

.sound-panel{

    margin-top:40px;

    width:540px;

    padding:24px;

    border-radius:28px;

    background:
    rgba(255,255,255,.04);

    border:
    1px solid rgba(255,255,255,.06);
}

.sound-buttons{

    display:flex;

    flex-wrap:wrap;

    gap:12px;

    margin-top:16px;
}

.sound-btn{

    border:none;

    padding:12px 18px;

    border-radius:14px;

    color:white;

    cursor:pointer;

    background:
    rgba(255,255,255,.06);

    transition:.3s;
}

.sound-btn:hover{

    background:
    rgba(139,92,255,.18);
}

.volume{

    margin-top:20px;
}

/* ================================= */
/* 右边 */
/* ================================= */

.companion{

    position:relative;

    overflow:hidden;

    display:flex;

    align-items:flex-end;
    justify-content:center;
}

.character{

    position:absolute;

    bottom:0;

    right:-20px;

    height:92%;

    opacity:.92;

    filter:
    drop-shadow(
    0 0 40px
    rgba(139,92,255,.3));
}

.overlay{

    position:absolute;

    inset:0;

    background:
    linear-gradient(
    to top,
    rgba(6,8,22,.95),
    transparent 45%);
}

.companion-ui{

    position:absolute;

    top:48px;
    left:32px;

    z-index:5;
}

.companion-title{

    font-size:30px;

    margin-bottom:18px;
}

.quote{

    line-height:2;

    color:#dbe5ff;
}

/* ================================= */
/* 响应式 */
/* ================================= */

@media(max-width:1400px){

    .main{

        grid-template-columns:
        320px
        1fr;
    }

    .companion{

        display:none;
    }
}

@media(max-width:1000px){

    body{

        overflow:auto;
    }

    .main{

        grid-template-columns:
        1fr;
    }

    .energy-ring{

        width:320px;
        height:320px;
    }

    .time{

        font-size:64px;
    }

    .sound-panel{

        width:95%;
    }
}

</style>
</head>

<body>

<div class="stars" id="stars"></div>

<div class="nebula nebula1"></div>
<div class="nebula nebula2"></div>

<div class="app">

    <!-- 左侧 -->

    <div class="sidebar">

        <div class="logo">
            ✦
        </div>

        <div class="nav-btn">
            ⌛
        </div>

        <div class="nav-btn">
            ♫
        </div>

        <div class="nav-btn">
            ☾
        </div>

        <div class="nav-btn">
            ⚙
        </div>

    </div>

    <!-- 主体 -->

    <div class="main">

        <!-- 左 -->

        <div class="dashboard panel">

            <!-- 科目 -->

            <div class="section">

                <div class="panel-title">
                    ✦ 当前学习科目
                </div>

                <div class="subject-input">

                    <input
                    id="subjectInput"
                    placeholder="输入学习科目">

                    <button
                    onclick="saveSubject()">

                        保存

                    </button>

                </div>

                <div class="current-subject">

                    当前：
                    <span id="currentSubject">
                        英语
                    </span>

                </div>

            </div>

            <!-- 统计 -->

            <div class="section">

                <div class="panel-title">
                    ☍ 学习统计
                </div>

                <div class="stats">

                    <div class="stat-card">

                        <div class="stat-label">
                            今日专注
                        </div>

                        <div class="stat-value"
                        id="focusTime">

                            0h

                        </div>

                    </div>

                    <div class="stat-card">

                        <div class="stat-label">
                            完成番茄
                        </div>

                        <div class="stat-value"
                        id="pomodoroCount">

                            0

                        </div>

                    </div>

                </div>

            </div>

            <!-- 历史 -->

            <div class="section">

                <div class="panel-title">
                    ☍ 学习历史
                </div>

                <div id="historyList"></div>

            </div>

            <!-- 热力图 -->

            <div class="section">

                <div class="panel-title">
                    ✦ 学习热力图
                </div>

                <div class="heatmap"
                id="heatmap"></div>

            </div>

            <!-- 排行榜 -->

            <div class="section">

                <div class="panel-title">
                    ✦ 科目排行榜
                </div>

                <div id="rankingList"></div>

            </div>

        </div>

        <!-- 中 -->

        <div class="center">

            <div class="energy-ring">

                <svg
                class="progress-ring"
                width="430"
                height="430">

                    <defs>

                        <linearGradient
                        id="gradient"
                        x1="0%"
                        y1="0%"
                        x2="100%"
                        y2="100%">

                            <stop
                            offset="0%"
                            stop-color="#8B5CFF"/>

                            <stop
                            offset="50%"
                            stop-color="#5DA9FF"/>

                            <stop
                            offset="100%"
                            stop-color="#FFB347"/>

                        </linearGradient>

                    </defs>

                    <circle
                    class="ring-bg"
                    cx="215"
                    cy="215"
                    r="180"/>

                    <circle
                    class="ring-progress"
                    id="progressCircle"
                    cx="215"
                    cy="215"
                    r="180"
                    stroke="url(#gradient)"/>

                </svg>

                <div class="timer-content">

                    <div class="mode">
                        FOCUS MODE
                    </div>

                    <div class="time"
                    id="timer">

                        25:00

                    </div>

                    <div class="tip">

                        沉浸当下，
                        未来会如你所愿。

                    </div>

                </div>

            </div>

            <!-- 按钮 -->

            <div class="controls">

                <button
                class="control-btn primary"
                onclick="startTimer()">

                    开始专注

                </button>

                <button
                class="control-btn secondary"
                onclick="pauseTimer()">

                    暂停

                </button>

                <button
                class="control-btn secondary"
                onclick="resetTimer()">

                    重置

                </button>

            </div>

            <!-- 音频 -->

            <div class="sound-panel">

                <div class="panel-title">
                    ☾ 深空环境音
                </div>

                <div class="sound-buttons">

                    <button
                    class="sound-btn"
                    onclick="playSound('rain')">

                        雨声

                    </button>

                    <button
                    class="sound-btn"
                    onclick="playSound('space')">

                        深空低频

                    </button>

                    <button
                    class="sound-btn"
                    onclick="playSound('library')">

                        图书馆

                    </button>

                    <button
                    class="sound-btn"
                    onclick="stopSound()">

                        停止

                    </button>

                </div>

                <div class="volume">

                    <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.01"
                    value="0.5"
                    id="volume">

                </div>

            </div>

        </div>

        <!-- 右 -->

        <div class="companion panel">

            <div class="companion-ui">

                <div class="companion-title">
                    夏以昼的陪伴
                </div>

                <div class="quote">

                    “别分神。<br>
                    你的每一分钟，<br>
                    都很重要。”

                </div>

            </div>

            <img
            class="character"
            src="https://cdn.pixabay.com/photo/2024/03/03/17/55/ai-generated-8607805_1280.png">

            <div class="overlay"></div>

        </div>

    </div>

</div>

<audio
id="bgAudio"
loop></audio>

<script>

/* ================================= */
/* 星空 */
/* ================================= */

const stars =
document.getElementById("stars");

for(let i=0;i<180;i++){

    let star =
    document.createElement("div");

    star.classList.add("star");

    let size =
    Math.random()*3;

    star.style.width =
    size + "px";

    star.style.height =
    size + "px";

    star.style.left =
    Math.random()*100 + "%";

    star.style.top =
    Math.random()*100 + "%";

    star.style.animationDuration =
    2 + Math.random()*5 + "s";

    stars.appendChild(star);
}

/* ================================= */
/* 数据 */
/* ================================= */

let totalSeconds =
25 * 60;

let initialSeconds =
25 * 60;

let timer = null;

let currentSubject =
localStorage.getItem(
"currentSubject"
) || "英语";

let todayMinutes =
parseInt(
localStorage.getItem(
"todayMinutes")
) || 0;

let pomodoroCount =
parseInt(
localStorage.getItem(
"pomodoroCount")
) || 0;

let subjectData =
JSON.parse(
localStorage.getItem(
"subjectData")
) || {};

let historyData =
JSON.parse(
localStorage.getItem(
"historyData")
) || {};

/* ================================= */
/* DOM */
/* ================================= */

document
.getElementById(
"currentSubject")
.innerText =
currentSubject;

/* ================================= */
/* 进度环 */
/* ================================= */

const circle =
document.getElementById(
"progressCircle");

const circumference =
1130;

function updateProgress(){

    const progress =
    totalSeconds /
    initialSeconds;

    const offset =
    circumference -
    progress *
    circumference;

    circle.style
    .strokeDashoffset =
    offset;
}

/* ================================= */
/* 时间 */
/* ================================= */

function updateDisplay(){

    let m =
    Math.floor(
    totalSeconds / 60);

    let s =
    totalSeconds % 60;

    document
    .getElementById("timer")
    .innerText =

    `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

    updateProgress();

    saveSessionState();
}

/* ================================= */
/* 计时 */
/* ================================= */

function startTimer(){

    clearInterval(timer);

    localStorage.setItem(
    "isRunning",
    "true");

    timer =
    setInterval(()=>{

        if(totalSeconds > 0){

            totalSeconds--;

            updateDisplay();

        }else{

            clearInterval(timer);

            finishSession();
        }

    },1000);
}

function pauseTimer(){

    clearInterval(timer);

    localStorage.setItem(
    "isRunning",
    "false");
}

function resetTimer(){

    clearInterval(timer);

    totalSeconds =
    initialSeconds;

    updateDisplay();

    localStorage.setItem(
    "isRunning",
    "false");
}

/* ================================= */
/* 完成 */
/* ================================= */

function finishSession(){

    pomodoroCount++;

    todayMinutes +=
    initialSeconds / 60;

    if(!subjectData[currentSubject]){

        subjectData[currentSubject] = 0;
    }

    subjectData[currentSubject] +=
    initialSeconds / 60;

    /* 历史 */

    const today =
    new Date()
    .toLocaleDateString();

    if(!historyData[today]){

        historyData[today] = [];
    }

    historyData[today].push({

        subject:
        currentSubject,

        duration:
        initialSeconds / 60
    });

    /* 保存 */

    localStorage.setItem(
    "todayMinutes",
    todayMinutes);

    localStorage.setItem(
    "pomodoroCount",
    pomodoroCount);

    localStorage.setItem(
    "subjectData",
    JSON.stringify(subjectData));

    localStorage.setItem(
    "historyData",
    JSON.stringify(historyData));

    renderStats();

    renderHistory();

    renderHeatmap();

    renderRanking();

    alert("本次专注完成。");

    resetTimer();
}

/* ================================= */
/* 保存状态 */
/* ================================= */

function saveSessionState(){

    localStorage.setItem(
    "remainingTime",
    totalSeconds);

    localStorage.setItem(
    "initialSeconds",
    initialSeconds);
}

function loadSessionState(){

    const savedTime =
    localStorage.getItem(
    "remainingTime");

    const savedInitial =
    localStorage.getItem(
    "initialSeconds");

    const running =
    localStorage.getItem(
    "isRunning");

    if(savedTime){

        totalSeconds =
        parseInt(savedTime);
    }

    if(savedInitial){

        initialSeconds =
        parseInt(savedInitial);
    }

    updateDisplay();

    if(running === "true"){

        startTimer();
    }
}

/* ================================= */
/* 科目 */
/* ================================= */

function saveSubject(){

    const value =
    document
    .getElementById(
    "subjectInput")
    .value
    .trim();

    if(value){

        currentSubject =
        value;

        localStorage.setItem(
        "currentSubject",
        value);

        document
        .getElementById(
        "currentSubject")
        .innerText =
        value;
    }
}

/* ================================= */
/* 统计 */
/* ================================= */

function renderStats(){

    document
    .getElementById(
    "focusTime")
    .innerText =

    (todayMinutes / 60)
    .toFixed(1) + "h";

    document
    .getElementById(
    "pomodoroCount")
    .innerText =
    pomodoroCount;
}

/* ================================= */
/* 历史 */
/* ================================= */

function renderHistory(){

    const container =
    document
    .getElementById(
    "historyList");

    container.innerHTML = "";

    const dates =
    Object.keys(historyData)
    .reverse();

    dates.slice(0,5)
    .forEach(date=>{

        historyData[date]
        .forEach(item=>{

            const div =
            document
            .createElement("div");

            div.className =
            "history-item";

            div.innerHTML = `

                📘 ${item.subject}<br>

                ⏳ ${item.duration} min<br>

                📅 ${date}

            `;

            container
            .appendChild(div);
        });
    });
}

/* ================================= */
/* 热力图 */
/* ================================= */

function renderHeatmap(){

    const heatmap =
    document
    .getElementById(
    "heatmap");

    heatmap.innerHTML = "";

    const today =
    new Date();

    for(let i=34;i>=0;i--){

        const date =
        new Date();

        date.setDate(
        today.getDate()-i);

        const key =
        date.toLocaleDateString();

        let total = 0;

        if(historyData[key]){

            historyData[key]
            .forEach(item=>{

                total +=
                item.duration;
            });
        }

        const cell =
        document
        .createElement("div");

        cell.className =
        "heat-cell";

        if(total >= 180){

            cell.style.background =
            "#FFB347";

        }else if(total >= 120){

            cell.style.background =
            "#5DA9FF";

        }else if(total >= 60){

            cell.style.background =
            "#8B5CFF";
        }

        heatmap.appendChild(cell);
    }
}

/* ================================= */
/* 排行榜 */
/* ================================= */

function renderRanking(){

    const ranking =
    document
    .getElementById(
    "rankingList");

    ranking.innerHTML = "";

    const subjects =
    Object.entries(subjectData);

    subjects.sort(
    (a,b)=>b[1]-a[1]);

    const max =
    subjects[0]
    ? subjects[0][1]
    : 1;

    subjects.forEach(item=>{

        const percent =
        (item[1]/max)*100;

        const div =
        document
        .createElement("div");

        div.className =
        "rank-item";

        div.innerHTML = `

            <div class="rank-top">

                <span>
                    ${item[0]}
                </span>

                <span>
                    ${(item[1]/60).toFixed(1)}h
                </span>

            </div>

            <div class="rank-bar">

                <div
                class="rank-fill">

                </div>

            </div>

        `;

        ranking.appendChild(div);

        setTimeout(()=>{

            div.querySelector(
            ".rank-fill")
            .style.width =
            percent + "%";

        },100);
    });
}

/* ================================= */
/* 音乐 */
/* ================================= */

const audio =
document
.getElementById(
"bgAudio");

const sounds = {

    rain:
    "./assets/audio/rain.mp3",

    space:
    "./assets/audio/space.mp3",

    library:
    "./assets/audio/library.mp3"
};

function playSound(type){

    audio.src =
    sounds[type];

    audio.play();
}

function stopSound(){

    audio.pause();

    audio.currentTime = 0;
}

document
.getElementById(
"volume")
.addEventListener(
"input",
e=>{

    audio.volume =
    e.target.value;
});

/* ================================= */
/* 初始化 */
/* ================================= */

renderStats();

renderHistory();

renderHeatmap();

renderRanking();

loadSessionState();

</script>
