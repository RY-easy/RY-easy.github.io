<!-- ========================= -->
<!-- 深空专注系统 v2 -->
<!-- 更高级沉浸式版本 -->
<!-- ========================= -->

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deep Space Focus</title>

<link rel="preconnect" href="https://fonts.googleapis.com">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    overflow:hidden;
    background:#020817;
    color:white;
    height:100vh;
}

/* ========================= */
/* 动态宇宙背景 */
/* ========================= */

.space-bg{

    position:fixed;
    inset:0;

    background:
    radial-gradient(circle at top,#244cff22,transparent 30%),
    radial-gradient(circle at bottom,#11306644,transparent 40%),
    linear-gradient(to bottom,#020817,#071122);

    overflow:hidden;
}

/* 星星 */

.star{

    position:absolute;
    background:white;
    border-radius:50%;
    opacity:.8;
    animation:twinkle linear infinite;
}

@keyframes twinkle{

    0%{opacity:.2}
    50%{opacity:1}
    100%{opacity:.2}
}

/* 浮动光 */

.glow{

    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.25;
    animation:float 12s ease-in-out infinite;
}

.glow1{
    width:500px;
    height:500px;
    background:#4d74ff;
    top:-100px;
    left:-100px;
}

.glow2{
    width:400px;
    height:400px;
    background:#5f8bff;
    right:-100px;
    bottom:-100px;
}

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-30px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* ========================= */
/* 主布局 */
/* ========================= */

.app{

    display:flex;
    height:100vh;
    position:relative;
    z-index:2;
}

/* ========================= */
/* 左侧导航 */
/* ========================= */

.sidebar{

    width:90px;

    background:rgba(10,15,30,.45);

    backdrop-filter:blur(20px);

    border-right:1px solid rgba(255,255,255,.08);

    display:flex;
    flex-direction:column;
    align-items:center;

    padding:30px 0;

    gap:28px;
}

.logo{

    width:54px;
    height:54px;

    border-radius:18px;

    background:
    linear-gradient(145deg,#8db5ff,#5578ff);

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;
    font-weight:bold;

    box-shadow:
    0 0 25px rgba(112,150,255,.55);
}

.nav-btn{

    width:58px;
    height:58px;

    border-radius:18px;

    background:rgba(255,255,255,.04);

    border:1px solid rgba(255,255,255,.05);

    color:#dce5ff;

    font-size:22px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.35s;
}

.nav-btn:hover{

    transform:translateY(-4px);

    background:rgba(120,160,255,.12);

    box-shadow:
    0 0 25px rgba(120,160,255,.2);
}

/* ========================= */
/* 中间区域 */
/* ========================= */

.main{

    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    position:relative;
}

/* 宇宙舷窗 */

.window{

    width:88%;
    height:88vh;

    border-radius:42px;

    background:
    linear-gradient(
    145deg,
    rgba(20,30,60,.55),
    rgba(10,15,35,.35));

    backdrop-filter:blur(35px);

    border:
    1px solid rgba(255,255,255,.08);

    box-shadow:
    0 0 60px rgba(0,0,0,.45),
    inset 0 0 60px rgba(255,255,255,.03);

    position:relative;

    overflow:hidden;

    display:flex;
}

/* ========================= */
/* 中间计时区 */
/* ========================= */

.focus-area{

    flex:1;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    position:relative;
}

/* 动态能源环 */

.energy-ring{

    width:420px;
    height:420px;

    border-radius:50%;

    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    animation:ringFloat 6s ease-in-out infinite;
}

@keyframes ringFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-12px);
    }

    100%{
        transform:translateY(0px);
    }
}

.energy-ring::before{

    content:"";

    position:absolute;

    inset:0;

    border-radius:50%;

    background:
    conic-gradient(
    from 0deg,
    #6ea1ff,
    #dbe6ff,
    #5f83ff,
    #6ea1ff);

    animation:rotate 10s linear infinite;

    filter:blur(.5px);

    box-shadow:
    0 0 35px rgba(120,160,255,.65);
}

.energy-ring::after{

    content:"";

    position:absolute;

    width:360px;
    height:360px;

    border-radius:50%;

    background:#07111f;

    border:
    1px solid rgba(255,255,255,.05);
}

@keyframes rotate{

    from{
        transform:rotate(0deg);
    }

    to{
        transform:rotate(360deg);
    }
}

/* 内部 */

.timer-content{

    position:relative;
    z-index:5;

    display:flex;
    flex-direction:column;
    align-items:center;
}

.mode{

    color:#a8bcff;
    letter-spacing:4px;

    margin-bottom:20px;
}

.time{

    font-size:92px;
    font-weight:200;

    letter-spacing:4px;

    text-shadow:
    0 0 20px rgba(160,190,255,.35);
}

.tip{

    margin-top:18px;

    color:#8ea2da;

    font-size:15px;
}

/* 控制按钮 */

.controls{

    margin-top:45px;

    display:flex;
    gap:18px;
}

.control-btn{

    padding:16px 34px;

    border:none;

    border-radius:18px;

    color:white;

    cursor:pointer;

    font-size:16px;

    background:
    linear-gradient(
    145deg,
    #8db5ff,
    #5a7bff);

    box-shadow:
    0 0 25px rgba(120,160,255,.35);

    transition:.35s;
}

.control-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 0 35px rgba(120,160,255,.55);
}

/* ========================= */
/* 右侧陪伴系统 */
/* ========================= */

.companion{

    width:360px;

    position:relative;

    border-left:
    1px solid rgba(255,255,255,.06);

    background:
    linear-gradient(
    to bottom,
    rgba(15,20,40,.28),
    rgba(5,10,20,.18));

    overflow:hidden;
}

/* 全息光 */

.holo{

    position:absolute;

    inset:0;

    background:
    linear-gradient(
    to bottom,
    transparent,
    rgba(120,160,255,.08));

    pointer-events:none;
}

/* 人物 */

.character{

    position:absolute;

    right:-40px;
    bottom:0;

    height:92%;

    opacity:.92;

    filter:
    drop-shadow(0 0 35px rgba(140,180,255,.25));

    animation:characterFloat 5s ease-in-out infinite;
}

@keyframes characterFloat{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-10px);
    }

    100%{
        transform:translateY(0px);
    }
}

/* 文字 */

.companion-ui{

    position:absolute;

    top:60px;
    left:35px;

    z-index:5;

    width:240px;
}

.title{

    font-size:28px;

    margin-bottom:22px;
}

.quote{

    line-height:2;

    color:#dce5ff;

    font-size:18px;
}

.signature{

    margin-top:20px;

    color:#89a0dc;
}

/* ========================= */
/* 底部系统栏 */
/* ========================= */

.bottom-system{

    position:absolute;

    left:50%;
    bottom:35px;

    transform:translateX(-50%);

    width:560px;

    height:74px;

    border-radius:24px;

    background:
    rgba(10,15,30,.55);

    backdrop-filter:blur(25px);

    border:
    1px solid rgba(255,255,255,.08);

    display:flex;
    align-items:center;
    justify-content:space-around;
}

.system-item{

    color:#dce5ff;

    font-size:15px;
}

/* ========================= */
/* 响应式 */
/* ========================= */

@media(max-width:1200px){

    .companion{
        display:none;
    }

    .energy-ring{
        width:320px;
        height:320px;
    }

    .energy-ring::after{
        width:260px;
        height:260px;
    }

    .time{
        font-size:70px;
    }
}

</style>
</head>

<body>

<!-- 动态背景 -->

<div class="space-bg">

    <div class="glow glow1"></div>
    <div class="glow glow2"></div>

</div>

<!-- 主体 -->

<div class="app">

    <!-- 左侧 -->

    <div class="sidebar">

        <div class="logo">✦</div>

        <div class="nav-btn">⌛</div>
        <div class="nav-btn">♫</div>
        <div class="nav-btn">☾</div>
        <div class="nav-btn">☍</div>
        <div class="nav-btn">⚙</div>

    </div>

    <!-- 中间 -->

    <div class="main">

        <div class="window">

            <!-- 计时区 -->

            <div class="focus-area">

                <div class="energy-ring">

                    <div class="timer-content">

                        <div class="mode">
                            FOCUS MODE
                        </div>

                        <div class="time" id="timer">
                            25:00
                        </div>

                        <div class="tip">
                            沉浸当下，未来会如你所愿。
                        </div>

                    </div>

                </div>

                <div class="controls">

                    <button class="control-btn"
                    onclick="startTimer()">
                        开始专注
                    </button>

                    <button class="control-btn"
                    onclick="pauseTimer()">
                        暂停
                    </button>

                </div>

            </div>

            <!-- 陪伴系统 -->

            <div class="companion">

                <div class="companion-ui">

                    <div class="title">
                        夏以昼的陪伴
                    </div>

                    <div class="quote">
                        “别分神。<br>
                        你的每一分钟，<br>
                        都很重要。”
                    </div>

                    <div class="signature">
                        —— 深空陪伴系统
                    </div>

                </div>

                <!-- 这里后面可以替换成更像夏以昼的图 -->

                <img
                class="character"
                src="https://i.imgur.com/8Km9tLL.png">

                <div class="holo"></div>

            </div>

            <!-- 底部系统 -->

            <div class="bottom-system">

                <div class="system-item">
                    ✦ 深空模式
                </div>

                <div class="system-item">
                    ☾ 白噪音
                </div>

                <div class="system-item">
                    ♫ 星际环境音
                </div>

                <div class="system-item">
                    ⚡ 沉浸专注
                </div>

            </div>

        </div>

    </div>

</div>

<script>

/* ========================= */
/* 星空生成 */
/* ========================= */

const bg = document.querySelector(".space-bg");

for(let i=0;i<160;i++){

    let star = document.createElement("div");

    star.classList.add("star");

    let size = Math.random()*3;

    star.style.width = size+"px";
    star.style.height = size+"px";

    star.style.left = Math.random()*100+"%";
    star.style.top = Math.random()*100+"%";

    star.style.animationDuration =
    2 + Math.random()*5 + "s";

    bg.appendChild(star);
}

/* ========================= */
/* 番茄钟 */
/* ========================= */

let totalSeconds = 25 * 60;

let timer;

function updateDisplay(){

    let minutes =
    Math.floor(totalSeconds / 60);

    let seconds =
    totalSeconds % 60;

    document.getElementById("timer").innerHTML =
    `${String(minutes).padStart(2,"0")}:${String(seconds).padStart(2,"0")}`;
}

function startTimer(){

    clearInterval(timer);

    timer = setInterval(()=>{

        if(totalSeconds > 0){

            totalSeconds--;

            updateDisplay();

        }else{

            clearInterval(timer);

            alert("专注结束。");

        }

    },1000);
}

function pauseTimer(){

    clearInterval(timer);
}

</script>

</body>
</html>
