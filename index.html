<!-- ===================================== -->
<!-- 深空专注系统 v5 -->
<!-- 新增： -->
<!-- 1. 学习记忆系统 -->
<!-- 2. 自定义科目 -->
<!-- 3. 学习时长统计 -->
<!-- 4. 学习历史 -->
<!-- 5. localStorage永久保存 -->
<!-- ===================================== -->

<!-- ========================= -->
<!-- 在 .focus-area 里面 -->
<!-- controls 按钮下面新增 -->
<!-- ========================= -->

<!-- ========================= -->
<!-- 学习科目系统 -->
<!-- ========================= -->

<div class="subject-panel">

    <div class="panel-title">
        ✦ 当前学习科目
    </div>

    <div class="subject-input">

        <input
        type="text"
        id="subjectInput"
        placeholder="输入学习科目">

        <button
        class="subject-btn"
        onclick="setSubject()">

            保存科目

        </button>

    </div>

    <div class="current-subject">

        当前：
        <span id="currentSubject">
            英语
        </span>

    </div>

</div>

<!-- ========================= -->
<!-- 数据统计 -->
<!-- ========================= -->

<div class="stats-panel">

    <div class="panel-title">
        ☍ 学习统计
    </div>

    <div class="stats-grid">

        <div class="stat-card">

            <div class="stat-label">
                今日专注
            </div>

            <div class="stat-value"
            id="todayFocus">

                0h

            </div>

        </div>

        <div class="stat-card">

            <div class="stat-label">
                完成番茄
            </div>

            <div class="stat-value"
            id="todayPomodoro">

                0

            </div>

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- 科目统计 -->
<!-- ========================= -->

<div class="subject-stats">

    <div class="panel-title">
        ✎ 科目学习时长
    </div>

    <div id="subjectList">

    </div>

</div>

<style>

/* ========================= */
/* 学习系统UI */
/* ========================= */

.subject-panel,
.stats-panel,
.subject-stats{

    margin-top:28px;

    width:520px;

    padding:22px;

    border-radius:24px;

    background:
    rgba(255,255,255,.04);

    border:
    1px solid rgba(255,255,255,.06);
}

/* 标题 */

.panel-title{

    font-size:16px;

    color:#dce5ff;

    margin-bottom:18px;
}

/* 输入 */

.subject-input{

    display:flex;

    gap:12px;
}

.subject-input input{

    flex:1;

    padding:14px;

    border:none;

    border-radius:14px;

    background:
    rgba(255,255,255,.08);

    color:white;

    outline:none;
}

.subject-btn{

    padding:14px 20px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(
    145deg,
    #8db5ff,
    #5578ff);

    color:white;

    cursor:pointer;
}

.current-subject{

    margin-top:15px;

    color:#9fb3ea;
}

/* ========================= */
/* 数据统计 */
/* ========================= */

.stats-grid{

    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:16px;
}

.stat-card{

    padding:20px;

    border-radius:18px;

    background:
    rgba(255,255,255,.04);
}

.stat-label{

    color:#8ea2da;

    margin-bottom:10px;
}

.stat-value{

    font-size:32px;

    color:white;
}

/* ========================= */
/* 科目统计 */
/* ========================= */

.subject-item{

    display:flex;

    justify-content:space-between;

    align-items:center;

    padding:14px;

    border-radius:14px;

    margin-bottom:12px;

    background:
    rgba(255,255,255,.04);
}

.subject-name{

    color:#dce5ff;
}

.subject-time{

    color:#8db5ff;
}

/* 响应式 */

@media(max-width:1200px){

    .subject-panel,
    .stats-panel,
    .subject-stats{

        width:90%;
    }
}

</style>

<script>

/* ================================= */
/* 学习记忆系统 */
/* ================================= */

/* 当前科目 */

let currentSubject = "英语";

/* 科目数据 */

let subjectData = JSON.parse(
localStorage.getItem("subjectData")
) || {};

/* 今日数据 */

let todayFocus = parseInt(
localStorage.getItem("todayFocus")
) || 0;

let todayPomodoro = parseInt(
localStorage.getItem("todayPomodoro")
) || 0;

/* ================================= */
/* 设置科目 */
/* ================================= */

function setSubject(){

    const input =
    document.getElementById(
    "subjectInput"
    );

    const value =
    input.value.trim();

    if(value){

        currentSubject = value;

        document.getElementById(
        "currentSubject"
        ).innerText = value;

        localStorage.setItem(
        "currentSubject",
        value
        );

        input.value = "";
    }
}

/* 读取科目 */

function loadSubject(){

    const saved =
    localStorage.getItem(
    "currentSubject"
    );

    if(saved){

        currentSubject = saved;

        document.getElementById(
        "currentSubject"
        ).innerText = saved;
    }
}

/* ================================= */
/* 记录学习时间 */
/* ================================= */

function recordStudy(minutes){

    /* 今日总时长 */

    todayFocus += minutes;

    localStorage.setItem(
    "todayFocus",
    todayFocus
    );

    /* 番茄数量 */

    todayPomodoro++;

    localStorage.setItem(
    "todayPomodoro",
    todayPomodoro
    );

    /* 科目累计 */

    if(!subjectData[currentSubject]){

        subjectData[currentSubject] = 0;
    }

    subjectData[currentSubject] += minutes;

    localStorage.setItem(
    "subjectData",
    JSON.stringify(subjectData)
    );

    updateStats();

    renderSubjectList();
}

/* ================================= */
/* 更新统计 */
/* ================================= */

function updateStats(){

    document.getElementById(
    "todayFocus"
    ).innerText =

    (todayFocus / 60).toFixed(1) + "h";

    document.getElementById(
    "todayPomodoro"
    ).innerText =

    todayPomodoro;
}

/* ================================= */
/* 渲染科目统计 */
/* ================================= */

function renderSubjectList(){

    const list =
    document.getElementById(
    "subjectList"
    );

    list.innerHTML = "";

    for(let subject in subjectData){

        const item =
        document.createElement("div");

        item.className =
        "subject-item";

        item.innerHTML = `

            <div class="subject-name">
                ${subject}
            </div>

            <div class="subject-time">
                ${subjectData[subject]} min
            </div>

        `;

        list.appendChild(item);
    }
}

/* ================================= */
/* 番茄结束时记录 */
/* ================================= */

/* 在 handleSessionEnd() 里面 */
/* focus结束时增加 */

recordStudy(
initialSeconds / 60
);

/* ================================= */
/* 初始化 */
/* ================================= */

loadSubject();

updateStats();

renderSubjectList();

</script>
