<!-- ===================================================== -->
<!-- Deep Space Focus v7 -->
<!-- 新增： -->
<!-- 1. 真动态进度环 -->
<!-- 2. 深空动态背景 -->
<!-- 3. 页面呼吸感 -->
<!-- 4. 学习历史系统 -->
<!-- 5. GitHub热力图 -->
<!-- 6. 科目排行榜 -->
<!-- ===================================================== -->

<!-- ========================= -->
<!-- 替换原来的 .energy-ring -->
<!-- ========================= -->

<div class="energy-ring">

    <!-- SVG 真进度环 -->

    <svg class="progress-ring"
    width="430"
    height="430">

        <circle
        class="ring-bg"
        cx="215"
        cy="215"
        r="180"/>

        <circle
        class="ring-progress"
        id="progressCircle"
        cx="215"
        cy="215"
        r="180"/>

    </svg>

    <div class="timer-content">

        <div class="mode">
            FOCUS MODE
        </div>

        <div class="time"
        id="timer">

            25:00

        </div>

        <div class="tip">

            沉浸当下，
            未来会如你所愿。

        </div>

    </div>

</div>

<!-- ========================= -->
<!-- 左侧新增：学习历史 -->
<!-- 放到 dashboard 最下面 -->
<!-- ========================= -->

<div class="history-panel">

    <div class="panel-title">
        ☍ 学习历史
    </div>

    <div id="historyList">

    </div>

</div>

<!-- ========================= -->
<!-- 热力图 -->
<!-- ========================= -->

<div class="heatmap-panel">

    <div class="panel-title">
        ✦ 学习热力图
    </div>

    <div class="heatmap"
    id="heatmap">

    </div>

</div>

<!-- ========================= -->
<!-- 科目排行榜 -->
<!-- ========================= -->

<div class="ranking-panel">

    <div class="panel-title">
        ✦ 科目排行榜
    </div>

    <div id="rankingList">

    </div>

</div>

<style>

/* ================================= */
/* 页面呼吸感 */
/* ================================= */

.panel{

    animation:
    breathing 6s ease-in-out infinite;
}

@keyframes breathing{

    0%{

        transform:
        translateY(0px);

        box-shadow:
        0 10px 40px
        rgba(0,0,0,.2);
    }

    50%{

        transform:
        translateY(-4px);

        box-shadow:
        0 18px 60px
        rgba(139,92,255,.18);
    }

    100%{

        transform:
        translateY(0px);

        box-shadow:
        0 10px 40px
        rgba(0,0,0,.2);
    }
}

/* ================================= */
/* 深空背景粒子 */
/* ================================= */

.nebula{

    position:fixed;

    width:600px;
    height:600px;

    border-radius:50%;

    filter:blur(120px);

    opacity:.15;

    animation:
    float 20s ease-in-out infinite;
}

.nebula1{

    background:#8B5CFF;

    top:-200px;
    left:-200px;
}

.nebula2{

    background:#5DA9FF;

    right:-200px;
    bottom:-200px;
}

@keyframes float{

    0%{
        transform:
        translateY(0px)
        translateX(0px);
    }

    50%{
        transform:
        translateY(-30px)
        translateX(20px);
    }

    100%{
        transform:
        translateY(0px)
        translateX(0px);
    }
}

/* ================================= */
/* 真动态进度环 */
/* ================================= */

.progress-ring{

    position:absolute;

    transform:
    rotate(-90deg);
}

.ring-bg{

    fill:none;

    stroke:
    rgba(255,255,255,.06);

    stroke-width:12;
}

.ring-progress{

    fill:none;

    stroke:
    url(#gradient);

    stroke-width:14;

    stroke-linecap:round;

    stroke-dasharray:1130;

    stroke-dashoffset:0;

    transition:
    stroke-dashoffset 1s linear;

    filter:
    drop-shadow(
    0 0 15px
    rgba(139,92,255,.7));
}

/* ================================= */
/* 学习历史 */
/* ================================= */

.history-panel{

    padding:22px;

    border-radius:24px;

    background:
    rgba(255,255,255,.03);
}

.history-item{

    padding:14px;

    border-radius:14px;

    margin-top:12px;

    background:
    rgba(255,255,255,.03);

    color:#cfd8ff;

    line-height:1.8;
}

/* ================================= */
/* 热力图 */
/* ================================= */

.heatmap-panel{

    margin-top:22px;

    padding:22px;

    border-radius:24px;

    background:
    rgba(255,255,255,.03);
}

.heatmap{

    display:grid;

    grid-template-columns:
    repeat(7,1fr);

    gap:8px;

    margin-top:18px;
}

.heat-cell{

    width:34px;
    height:34px;

    border-radius:8px;

    background:
    rgba(255,255,255,.05);

    transition:.3s;
}

/* ================================= */
/* 排行榜 */
/* ================================= */

.ranking-panel{

    margin-top:22px;

    padding:22px;

    border-radius:24px;

    background:
    rgba(255,255,255,.03);
}

.rank-item{

    margin-top:18px;
}

.rank-top{

    display:flex;

    justify-content:space-between;

    margin-bottom:10px;

    color:#dce5ff;
}

.rank-bar{

    height:10px;

    border-radius:10px;

    overflow:hidden;

    background:
    rgba(255,255,255,.05);
}

.rank-fill{

    height:100%;

    border-radius:10px;

    background:
    linear-gradient(
    90deg,
    #8B5CFF,
    #5DA9FF,
    #FFB347);

    width:0%;

    transition:1s;
}

</style>

<script>

/* ================================= */
/* SVG渐变 */
/* ================================= */

document.querySelector(".progress-ring")
.insertAdjacentHTML("beforeend",`

<defs>

<linearGradient
id="gradient"
x1="0%"
y1="0%"
x2="100%"
y2="100%">

<stop
offset="0%"
stop-color="#8B5CFF"/>

<stop
offset="50%"
stop-color="#5DA9FF"/>

<stop
offset="100%"
stop-color="#FFB347"/>

</linearGradient>

</defs>

`);

/* ================================= */
/* 深空星云 */
/* ================================= */

const nebula1 =
document.createElement("div");

nebula1.className =
"nebula nebula1";

document.body.appendChild(nebula1);

const nebula2 =
document.createElement("div");

nebula2.className =
"nebula nebula2";

document.body.appendChild(nebula2);

/* ================================= */
/* 真进度环 */
/* ================================= */

const circle =
document.getElementById(
"progressCircle");

const circumference =
1130;

function updateProgress(){

    const progress =
    totalSeconds / (25 * 60);

    const offset =
    circumference -
    progress * circumference;

    circle.style
    .strokeDashoffset =
    offset;
}

/* ================================= */
/* 修改 updateDisplay() */
/* ================================= */

function updateDisplay(){

    let m =
    Math.floor(
    totalSeconds / 60);

    let s =
    totalSeconds % 60;

    document
    .getElementById("timer")
    .innerText =

    `${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;

    updateProgress();
}

/* ================================= */
/* 学习历史系统 */
/* ================================= */

let historyData =
JSON.parse(
localStorage.getItem(
"historyData")
) || [];

function saveHistory(){

    const today =
    new Date()
    .toLocaleDateString();

    const record = {

        date:today,

        subject:
        currentSubject,

        duration:25
    };

    historyData.unshift(record);

    if(historyData.length > 20){

        historyData.pop();
    }

    localStorage.setItem(
    "historyData",
    JSON.stringify(historyData)
    );

    renderHistory();
}

function renderHistory(){

    const list =
    document
    .getElementById(
    "historyList");

    list.innerHTML = "";

    historyData.forEach(item=>{

        const div =
        document
        .createElement("div");

        div.className =
        "history-item";

        div.innerHTML = `

            📘 ${item.subject}<br>

            ⏳ ${item.duration} min<br>

            📅 ${item.date}

        `;

        list.appendChild(div);
    });
}

/* ================================= */
/* 热力图 */
/* ================================= */

function renderHeatmap(){

    const heatmap =
    document
    .getElementById(
    "heatmap");

    heatmap.innerHTML = "";

    for(let i=0;i<35;i++){

        const cell =
        document
        .createElement("div");

        cell.className =
        "heat-cell";

        const level =
        Math.random();

        if(level > .8){

            cell.style.background =
            "#FFB347";

        }else if(level > .6){

            cell.style.background =
            "#5DA9FF";

        }else if(level > .3){

            cell.style.background =
            "#8B5CFF";
        }

        heatmap.appendChild(cell);
    }
}

/* ================================= */
/* 排行榜 */
/* ================================= */

function renderRanking(){

    const ranking =
    document
    .getElementById(
    "rankingList");

    ranking.innerHTML = "";

    const subjects =
    Object.entries(subjectData);

    subjects.sort(
    (a,b)=>b[1]-a[1]);

    const max =
    subjects[0]
    ? subjects[0][1]
    : 1;

    subjects.forEach(item=>{

        const percent =
        (item[1]/max)*100;

        const div =
        document
        .createElement("div");

        div.className =
        "rank-item";

        div.innerHTML = `

            <div class="rank-top">

                <span>
                    ${item[0]}
                </span>

                <span>
                    ${(item[1]/60).toFixed(1)}h
                </span>

            </div>

            <div class="rank-bar">

                <div
                class="rank-fill"
                style="width:${percent}%">

                </div>

            </div>

        `;

        ranking.appendChild(div);
    });
}

/* ================================= */
/* 修改 finishSession() */
/* ================================= */

function finishSession(){

    pomodoroCount++;

    todayMinutes += 25;

    if(!subjectData[currentSubject]){

        subjectData[currentSubject] = 0;
    }

    subjectData[currentSubject] += 25;

    localStorage.setItem(
    "todayMinutes",
    todayMinutes);

    localStorage.setItem(
    "pomodoroCount",
    pomodoroCount);

    localStorage.setItem(
    "subjectData",
    JSON.stringify(subjectData));

    saveHistory();

    renderStats();

    renderSubjects();

    renderRanking();

    renderHeatmap();

    alert("本次专注完成。");

    resetTimer();
}

/* ================================= */
/* 初始化 */
/* ================================= */

renderHistory();

renderHeatmap();

renderRanking();

updateProgress();

</script>
